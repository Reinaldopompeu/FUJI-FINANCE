<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Caixa Fácil — gestão financeira simples, visual e segura." />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <link rel="icon" href="{{ url_for('static', filename='imagens/icone.svg') }}" type="image/svg+xml" />
    <title>{% block title %}Caixa Fácil{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='categories') }}" />
    {% block head_extra %}{% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/material.css', v='categories') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transaction.css', v='20260923-review-column') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css', v='20260908-analysis') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page-refinements.css', v='20260909-pages') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/material-unified.css', v='20260923-polish') }}" />
  </head>
  <body class="{% block body_class %}{% endblock %}" data-page="{{ page_id|default('') }}" data-demo="{{ 'true' if modo_demo else 'false' }}">
    <a class="skip-link" href="#mainContent">Ir para o conteúdo principal</a>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/demo-session.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
